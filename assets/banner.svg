<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="40%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#312e81"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".4"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes floatFast{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}@keyframes scanLine{0%{transform:translateX(-100%)}}.floating-card-1{animation:floatSlow 6s ease-in-out infinite}.floating-card-2{animation:floatSlow 7s ease-in-out infinite 1s}.floating-card-3{animation:floatFast 5s ease-in-out infinite .5s}.pulsing-orb{animation:pulseGlow 4s ease-in-out infinite}.scanner-beam{animation:scanLine 8s linear infinite}.network-line{stroke-dasharray:6 6;animation:dashRotate 20s linear infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="90" r="180" fill="url(#glowGrad)" class="pulsing-orb"/><circle cx="1000" cy="270" r="220" fill="url(#glowGrad)" class="pulsing-orb" style="animation-delay:2s"/><g stroke="#fff" stroke-opacity=".05" stroke-width="1"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="180" 